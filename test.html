<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Stewrd</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --brand: #2FAAE1; --bg: #f4f9fc; --card-bg: #ffffff; --text-primary: #0d2d3a; --input-bg: #f0f8fd; --input-border: #b8dff0; }
  body.dark { --bg: #071820; --card-bg: #0d2535; --text-primary: #e0f4fd; --input-bg: #071820; --input-border: #1a3f55; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
  .login-card { background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
  .login-card img { height: 40px; margin-bottom: 20px; }
  input { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); padding: 12px; border-radius: 8px; margin-bottom: 16px; color: var(--text-primary); outline: none; box-sizing: border-box; }
  input:focus { border-color: var(--brand); }
  button { width: 100%; background: var(--brand); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  button:hover { opacity: 0.9; }
</style>
</head>
<body class="dark"> <div class="login-card">
    <img src="stewrd-logo.png" alt="Stewrd Logo" onerror="this.style.display='none'">
    <h2>Admin Portal</h2>
    <p style="font-size: 13px; color: gray; margin-bottom: 24px;">Sign in to manage HR & TRF records</p>
    
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="signIn()" id="loginBtn">Sign In</button>
    <p id="errorMsg" style="color: #dc2626; font-size: 12px; margin-top: 12px; display: none;"></p>
  </div>

  <script>
    // ⚠️ PASTE YOUR SUPABASE DETAILS HERE
    const supabaseUrl = 'YOUR_SUPABASE_URL';
    const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      
      btn.textContent = 'Signing in...';
      err.style.display = 'none';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        err.textContent = error.message;
        err.style.display = 'block';
        btn.textContent = 'Sign In';
      } else {
        // Redirect to your main dashboard on success
        window.location.href = 'index.html'; 
      }
    }
  </script>
</body>
</html>
